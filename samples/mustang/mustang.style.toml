[compose.style.mustang]
bpm = [118, 124]
tonics = [["E", 3], ["D", 1], ["A", 1]]
modes = [["minor", 1]]

[compose.style.mustang.harmony]
beats = 4
start = ["i"]
cadence = ["VI", "i"]
markov = { i = [["VI", 4], ["iv", 2]], VI = [["III", 4], ["V", 2]], III = [["VII", 4]], VII = [["i", 4]], iv = [["VI", 2]], V = [["i", 2]] }

[compose.style.mustang.melody]
