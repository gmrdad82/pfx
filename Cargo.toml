[workspace]
members = ["crates/assets", "crates/bake", "crates/bench", "crates/build", "crates/cache", "crates/compose", "crates/core", "crates/denoise", "crates/docs-bundle", "crates/editor", "crates/editor-doc", "crates/editor-shell", "crates/editor-style", "crates/editor-toml", "crates/editor-viewport", "crates/file", "crates/film", "crates/game", "crates/generators", "crates/geom", "crates/glb", "crates/gpu", "crates/input", "crates/launcher", "crates/live", "crates/load", "crates/materials", "crates/mesh", "crates/mod", "crates/motion", "crates/physics", "crates/play", "crates/post", "crates/project", "crates/recipe", "crates/recipe-scene", "crates/run", "crates/runtime", "crates/scene", "crates/settings", "crates/source", "crates/sound", "crates/splash", "crates/steam", "crates/still", "crates/text", "crates/theme", "crates/trace", "crates/workbench"]

[workspace.package]
version = "3.1.4"
edition = "2024"
rust-version = "1.97"
publish = false
license = "AGPL-3.0-only"
authors = ["Gamer Dad"]

[package]
name = "pfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pfx, a game and render engine: the crates games and apps link, from the game runtime and live renderer to physics, sound, input, mods and the editor, and the pfx tool that scaffolds, edits, benches and bakes games and renders offline on its path tracer"
publish.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["harness", "editor", "bench", "shot-sound", "sound-clean"]
editor = ["harness", "dep:pfx-workbench"]
bench = ["harness", "dep:pfx-bench"]
harness = ["dep:pfx-core", "dep:pfx-cache", "dep:toml", "dep:sha2", "dep:png", "dep:hex", "dep:pollster", "dep:exr", "dep:pfx-run", "pfx-run/encode", "dep:pfx-sound", "pfx-sound/media", "dep:pfx-assets", "dep:pfx-bake", "dep:pfx-gpu", "pfx-gpu/dev-hooks", "dep:pfx-text", "dep:pfx-load", "dep:pfx-project", "dep:pfx-film", "dep:pfx-recipe", "dep:pfx-build", "dep:pfx-glb", "dep:pfx-mesh", "dep:pfx-motion", "dep:pfx-generators", "dep:pfx-recipe-scene", "dep:pfx-still", "dep:pfx-post", "dep:pfx-file", "dep:pfx-source", "dep:pfx-settings", "dep:pfx-splash", "dep:clap", "dep:gltf", "dep:glam", "dep:terminal_size"]
shot-sound = ["bench", "pfx-sound/shot"]
sound-clean = ["harness", "pfx-sound/clean"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", optional = true }
sha2 = { version = "0.11", optional = true }
png = { version = "0.18", optional = true }
hex = { version = "0.4", optional = true }
pfx-core = { path = "crates/core", optional = true }
pfx-cache = { path = "crates/cache", optional = true }
pfx-run = { path = "crates/run", optional = true }
pfx-assets = { path = "crates/assets", optional = true }
pfx-bake = { path = "crates/bake", optional = true }
pfx-gpu = { path = "crates/gpu", optional = true }
pfx-load = { path = "crates/load", optional = true }
pfx-text = { path = "crates/text", features = ["subset"], optional = true }
pollster = { version = "0.4", optional = true }
exr = { version = "1.74", optional = true }
pfx-workbench = { path = "crates/workbench", optional = true }
pfx-bench = { path = "crates/bench", optional = true }
pfx-sound = { path = "crates/sound", optional = true }
pfx-project = { path = "crates/project", features = ["scaffold"], optional = true }
pfx-film = { path = "crates/film", features = ["video"], optional = true }
pfx-recipe = { path = "crates/recipe", optional = true }
pfx-build = { path = "crates/build", optional = true }
pfx-glb = { path = "crates/glb", optional = true }
pfx-mesh = { path = "crates/mesh", optional = true }
pfx-motion = { path = "crates/motion", optional = true }
pfx-generators = { path = "crates/generators", optional = true }
pfx-recipe-scene = { path = "crates/recipe-scene", optional = true }
pfx-still = { path = "crates/still", optional = true }
pfx-post = { path = "crates/post", optional = true }
pfx-file = { path = "crates/file", optional = true }
pfx-source = { path = "crates/source", optional = true }
pfx-settings = { path = "crates/settings", optional = true }
pfx-splash = { path = "crates/splash", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
gltf = { version = "1.4", features = ["extras", "KHR_texture_transform"], optional = true }
glam = { version = "0.33", features = ["libm"], optional = true }
terminal_size = { version = "0.4", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
pito-codecs = { git = "https://github.com/gmrdad82/pito-codecs", tag = "v1.16.3", default-features = false, features = ["h264", "hevc", "vp9", "aac", "opus", "mp4", "mkv", "gpu", "filter"] }

[[bin]]
name = "pfx"
path = "src/main.rs"
required-features = ["harness"]

[[example]]
name = "checker"
path = "examples/checker.rs"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false

[profile.dev.package.pfx]
opt-level = 2

[profile.dev.package.pito-codecs]
opt-level = 3

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

[profile.dev.package.crc32fast]
opt-level = 2

[profile.dev.package.adler2]
opt-level = 2

[profile.dev.package.simd-adler32]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2
