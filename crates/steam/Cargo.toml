[package]
name = "pfx-steam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pfx's Steam: achievements, stats, Cloud saves, the overlay, rich presence, leaderboards, daily seeded runs, lobbies and peer-to-peer lockstep"
publish.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["live"]
live = ["dep:steamworks"]
input = ["dep:pfx-input"]

[dependencies]
pfx-core = { path = "../core" }
steamworks = { version = "=0.13.1", optional = true, features = ["raw-bindings"] }
pfx-input = { path = "../input", default-features = false, optional = true }

[dev-dependencies]
pfx-input = { path = "../input", default-features = false }
