[package]
name = "pfx-load"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pfx's asset loading: meshes, images, HDR skies and fonts, shipped with the product and cached"
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
gltf = { version = "1.4", default-features = false, features = ["names", "utils", "extras", "extensions"] }
png = "0.18"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
pfx-scene = { path = "../scene" }
pfx-file = { path = "../file" }
notify = "8.2"
pfx-core = { path = "../core" }
pfx-materials = { path = "../materials" }
pfx-post = { path = "../post" }
pfx-text = { path = "../text" }

[features]
fixture = ["pfx-core/fixture"]

[dev-dependencies]
pfx-core = { path = "../core", features = ["fixture"] }
zune-jpeg = "=0.5.15"

[[example]]
name = "head_glb"
required-features = ["fixture"]

[[example]]
name = "file_load"
required-features = ["fixture"]
