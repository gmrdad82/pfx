[package]
name = "pfx-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "pfx's builder: a recipe to GLB nodes, sidecar facts and a bake recipe, headless and deterministic"

[dependencies]
pfx-recipe = { path = "../recipe" }
pfx-mesh = { path = "../mesh" }
pfx-motion = { path = "../motion" }
pfx-glb = { path = "../glb" }
pfx-materials = { path = "../materials" }
pfx-core = { path = "../core" }
pfx-load = { path = "../load" }
pfx-scene = { path = "../scene" }
pfx-file = { path = "../file" }
sha2 = "0.11"
toml = "1.1"
serde_json = "1"
glam = { version = "0.33", features = ["libm"] }
gltf = { version = "1.4", features = ["extras", "KHR_texture_transform"] }
png = "0.18"
pfx-trace = { path = "../trace" }

[dev-dependencies]
pfx-load = { path = "../load", features = ["fixture"] }
pfx-post = { path = "../post" }
pfx-gpu = { path = "../gpu", features = ["dev-hooks"] }
pfx-bake = { path = "../bake" }
pfx-live = { path = "../live" }
pfx-recipe-scene = { path = "../recipe-scene" }
pfx-still = { path = "../still" }
