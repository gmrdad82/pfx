[package]
name = "pfx-workbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "pfx gui's window: recipes, .pitofx documents and scenes in one layout of coded panels, with the offscreen shot and the tape clips"

[dependencies]
egui = { version = "=0.36.2", default-features = false }
egui-wgpu = { version = "=0.36.2", default-features = false }
pfx-editor = { path = "../editor" }
pfx-play = { path = "../play" }
pfx-game = { path = "../game", features = ["modules"] }
pfx-editor-shell = { path = "../editor-shell" }
pfx-editor-style = { path = "../editor-style" }
pfx-editor-viewport = { path = "../editor-viewport" }
pfx-core = { path = "../core" }
pfx-gpu = { path = "../gpu" }
pfx-live = { path = "../live", features = ["dev-hud"] }
pfx-load = { path = "../load" }
pfx-materials = { path = "../materials" }
pfx-project = { path = "../project" }
png = "0.18"
pfx-recipe = { path = "../recipe" }
pfx-build = { path = "../build" }
pfx-recipe-scene = { path = "../recipe-scene" }
pfx-motion = { path = "../motion" }
pfx-file = { path = "../file" }
pfx-settings = { path = "../settings" }
pfx-splash = { path = "../splash" }
glam = { version = "0.33", features = ["libm"] }
toml_edit = { version = "0.25", features = ["serde"] }
serde_json = "1"

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
pfx-project = { path = "../project", features = ["scaffold"] }
pfx-scene = { path = "../scene" }
pfx-gpu = { path = "../gpu", features = ["dev-hooks"] }
