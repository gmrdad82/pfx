[package]
name = "pfx-recipe-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "pfx's recipe to engine scene: cameras, sun, sky, lights, materials by preset, text, and the headless still"

[dependencies]
pfx-recipe = { path = "../recipe" }
pfx-build = { path = "../build" }
pfx-live = { path = "../live" }
pfx-load = { path = "../load" }
pfx-settings = { path = "../settings", default-features = false }
pfx-geom = { path = "../geom" }
pfx-gpu = { path = "../gpu" }
pfx-materials = { path = "../materials" }
pfx-text = { path = "../text" }
pfx-post = { path = "../post" }
pfx-core = { path = "../core" }
png = "0.18"
pfx-glb = { path = "../glb" }
pfx-mesh = { path = "../mesh" }
pfx-trace = { path = "../trace" }
pfx-bake = { path = "../bake" }
serde_json = "1"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[dev-dependencies]
pfx-gpu = { path = "../gpu", features = ["dev-hooks"] }
