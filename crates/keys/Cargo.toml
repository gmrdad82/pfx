[package]
name = "pfx-keys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "pfx's keys: one keymap per app or window, its groups, modes and contexts declared once, with the ? help sheet's model, the legend's hints and its clashes built from it, and egui's, winit's and a terminal's key events read as its chords"

[dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["events"], optional = true }
egui = { version = "=0.36.2", default-features = false, optional = true }
winit = { version = "=0.30.13", optional = true }

[features]
egui = ["dep:egui"]
terminal = ["dep:crossterm"]
winit = ["dep:winit"]

[dev-dependencies]
pfx-keys = { path = ".", features = ["egui", "terminal", "winit"] }
