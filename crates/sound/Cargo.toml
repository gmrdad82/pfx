[package]
name = "pfx-sound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pfx's sound: chimes and streams played live, and audio tracks mixed deterministically for rendered clips"
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
pfx-core = { path = "../core" }
cpal = "=0.18.1"
lewton = { version = "=0.10.2", optional = true }

[features]
vorbis = ["dep:lewton"]

[dev-dependencies]
pfx-sound = { path = ".", features = ["vorbis"] }
