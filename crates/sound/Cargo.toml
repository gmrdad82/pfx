[package]
name = "pfx-sound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pfx's sound: chimes and streams played live, and audio tracks mixed deterministically for rendered clips"
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
pfx-core = { path = "../core" }
cpal = "=0.18.1"
lewton = { version = "=0.10.2", optional = true }
pito-codecs = { git = "https://github.com/gmrdad82/pito-codecs", tag = "v1.14.3", default-features = false, features = ["audio", "aac", "ac3", "mp3", "opus", "mp4", "mkv"], optional = true }
toml = { version = "0.9", optional = true }

[features]
vorbis = ["dep:lewton"]
media = ["dep:pito-codecs"]
voicefx = []
clean = ["voicefx"]
shot = ["dep:toml", "voicefx"]

[dev-dependencies]
pfx-sound = { path = ".", features = ["vorbis", "voicefx", "shot", "media", "clean"] }
