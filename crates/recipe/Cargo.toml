[package]
name = "pfx-recipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "pfx's recipe: parse, validate, patch and write scene recipes"

[dependencies]
pfx-mesh = { path = "../mesh" }
pfx-motion = { path = "../motion" }
pfx-materials = { path = "../materials" }
pfx-scene = { git = "https://github.com/gmrdad82/pfx-scene", tag = "v1.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", features = ["serde"] }
