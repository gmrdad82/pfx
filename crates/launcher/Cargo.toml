[package]
name = "pfx-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pfx's Windows window launcher, shipped as pfx.exe beside the pfx.com console tool: it starts pfx.com gui with no console window and returns"
