[package]
name = "pfx-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pfx's projects: a game's project.toml, its scenes and content folders, and pfx new's scaffold of a game repo"
publish.workspace = true
license.workspace = true
authors.workspace = true

[features]
scaffold = ["dep:pfx-scene", "dep:pfx-geom", "dep:pfx-glb", "dep:pfx-mesh", "dep:ttf-parser", "dep:png"]

[dependencies]
toml = "0.9"
pfx-file = { path = "../file" }
pfx-scene = { path = "../scene", optional = true }
pfx-geom = { path = "../geom", optional = true }
pfx-glb = { path = "../glb", optional = true }
pfx-mesh = { path = "../mesh", optional = true }
ttf-parser = { version = "0.25", default-features = false, features = ["std"], optional = true }
png = { version = "0.18", optional = true }

[dev-dependencies]
pfx-mod = { path = "../mod" }
