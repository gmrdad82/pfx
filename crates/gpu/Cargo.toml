[package]
name = "pfx-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pfx's GPU setup: device and adapter, offscreen targets and readback, GPU timing"
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
winit = { version = "=0.30.13", optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "metal", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "vulkan", "wgsl"] }
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
wayland-backend = { version = "0.3", features = ["client_system"], optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }

[features]
window = [
    "dep:winit",
    "dep:wayland-backend",
    "dep:wayland-client",
    "dep:wayland-protocols",
]
dev-hooks = []

[dev-dependencies]
pfx-gpu = { path = ".", features = ["dev-hooks"] }
pollster = "0.4"
winit = "=0.30.13"
