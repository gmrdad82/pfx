[package]
name = "pfx-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pfx's text: glyphs from vector outlines at any screen density, crisp at 4K"
publish.workspace = true
license.workspace = true
authors.workspace = true

[features]
subset = ["dep:skera", "dep:write-fonts", "dep:encoding_rs", "dep:pfx-core"]
fixture = []

[dependencies]
cosmic-text = { version = "=0.15.0", default-features = false, features = ["std", "swash"] }
swash = "=0.2.10"
unicode-script = "=0.5.8"
unicode-segmentation = "=1.13.3"
skera = { version = "=0.8.0", optional = true }
write-fonts = { version = "=0.54.0", default-features = false, features = ["read"], optional = true }
encoding_rs = { version = "=0.8.42", optional = true }
pfx-core = { path = "../core", optional = true }

[dev-dependencies]
pfx-text = { path = ".", features = ["subset"] }
png = "0.18"
unicode-linebreak = "=0.1.5"

[[example]]
name = "font_subset"
required-features = ["subset"]

[[example]]
name = "cjk_compare"
