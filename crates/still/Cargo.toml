[package]
name = "pfx-still"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "pfx's renders: path-traced stills, equirect and ortho, PNG, EXR and HDR out"

[dependencies]
pfx-trace = { path = "../trace" }
pfx-denoise = { path = "../denoise" }
pfx-gpu = { path = "../gpu" }
pfx-live = { path = "../live" }
pfx-materials = { path = "../materials" }
pfx-post = { path = "../post" }
pfx-text = { path = "../text" }
pfx-build = { path = "../build" }
pfx-recipe = { path = "../recipe" }
pfx-recipe-scene = { path = "../recipe-scene" }
exr = "1.74"
png = "0.18"

[dev-dependencies]
pfx-gpu = { path = "../gpu", features = ["dev-hooks"] }
pfx-load = { path = "../load" }
