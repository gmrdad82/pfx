[package]
name = "pfx-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pfx's scene format: one TOML format for 3D scenes, materials and prefabs, with typed tables, errors at file:line:column, stable ids, versioned files with migrations, a writer that keeps the author's comments, spacing and order, and scenes packed into one .pfx file"
publish.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "pfx_scene"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
toml_edit = "0.25.15"
pfx-file = { path = "../file" }
schemars = { version = "1.2.3", optional = true }
serde_json = { version = "1", optional = true }

[features]
schema = ["dep:schemars", "dep:serde_json"]

[[example]]
name = "scene-schema"
required-features = ["schema"]
