[package]
name = "pfx-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pfx's physics: an SPH fluid with its height field, ripples, a pinned rope and bead chain, flocks and schools, wind, and 3D rigid bodies"
publish.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["rigid"]
rigid = ["dep:rapier3d", "dep:parry3d", "dep:pfx-core"]
enhanced-determinism = ["rigid", "rapier3d/enhanced-determinism", "parry3d/enhanced-determinism"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
half = "2"
pfx-core = { path = "../core", optional = true }
pfx-gpu = { path = "../gpu" }
parry3d = { version = "=0.31.1", default-features = false, features = ["required-features", "std"], optional = true }
rapier3d = { version = "=0.36.0", optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "wgsl", "vulkan"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan"] }

[dev-dependencies]
naga = { version = "27.0.3", features = ["wgsl-in"] }
pollster = "0.4"
