[package]
name = "pfx-trace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pfx's offline path tracer: the reference for stills, clips and the bake, over triangle meshes and analytic shapes with the shared materials"
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
pfx-core = { path = "../core" }
pfx-gpu = { path = "../gpu" }
pfx-load = { path = "../load" }
pfx-materials = { path = "../materials" }
pfx-text = { path = "../text" }

[target.'cfg(not(target_os = "windows"))'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "metal", "wgsl"] }

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
pfx-run = { path = "../run" }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["dx12", "vulkan", "wgsl"] }

[dev-dependencies]
pfx-text = { path = "../text", features = ["fixture"] }
half = "2"
pfx-geom = { path = "../geom" }
pfx-live = { path = "../live" }
pfx-post = { path = "../post" }
naga = { version = "27", features = ["wgsl-in"] }
pollster = "0.4"
png = "0.17"
serde_json = "1"
