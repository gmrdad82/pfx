[package]
name = "pfx-glb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "pfx's deterministic GLB writer, the facts sidecar, and the reader and diff behind pfx diff"

[dependencies]
pfx-mesh = { path = "../mesh" }
pfx-motion = { path = "../motion" }
glam = { version = "0.33", features = ["libm"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
gltf-json = { version = "1.4", features = ["extras", "extensions", "KHR_texture_transform"] }
gltf = { version = "1.4", features = ["extras", "KHR_texture_transform"] }

[dev-dependencies]
pfx-load = { path = "../load" }
