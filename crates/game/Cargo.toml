[package]
name = "pfx-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pfx's game runtime: the one call a game's main makes, owning the window, pacing, input, sound, frame stats and the fixed tick, with a launcher for the game's own commands"
publish.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["clipboard", "splash"]
clipboard = ["dep:arboard", "dep:smithay-clipboard"]
tools = []
dev-hud = ["pfx-play/dev-hud", "pfx-live/dev-hud"]
steam = ["dep:pfx-steam"]
modules = ["dep:pfx-mod", "dep:wit-parser", "dep:wit-component"]
splash = ["dep:pfx-splash"]

[dependencies]
pfx-core = { path = "../core" }
pfx-gpu = { path = "../gpu", features = ["window"] }
pfx-settings = { path = "../settings" }
pfx-input = { path = "../input" }
pfx-live = { path = "../live" }
pfx-load = { path = "../load" }
pfx-play = { path = "../play" }
pfx-sound = { path = "../sound" }
pfx-text = { path = "../text" }
pfx-mod = { path = "../mod", optional = true }
pfx-splash = { path = "../splash", optional = true }
wit-parser = { version = "=0.258.3", optional = true }
wit-component = { version = "=0.258.3", default-features = false, optional = true }
pfx-steam = { path = "../steam", default-features = false, features = ["input"], optional = true }
winit = "=0.30.13"
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { version = "=3.6.1", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-clipboard = { version = "=0.7.3", optional = true }

[dev-dependencies]
pfx-gpu = { path = "../gpu", features = ["dev-hooks"] }
pfx-text = { path = "../text", features = ["fixture"] }
serde_json = "1"
toml = "0.9"
wat = "=1.258.3"

[[example]]
name = "empty"
path = "examples/empty/main.rs"

[[example]]
name = "flat"
path = "examples/flat/main.rs"

[[example]]
name = "marker"
path = "examples/marker/main.rs"
required-features = ["modules"]
