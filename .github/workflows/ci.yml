name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  gate:
    name: ${{ matrix.phase }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        phase: [lint, tests, release]
        os: [ubuntu-26.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev ffmpeg
      - name: ffmpeg
        if: runner.os == 'macOS' && matrix.phase == 'tests'
        run: brew install ffmpeg
      - name: ffmpeg
        if: runner.os == 'Windows' && matrix.phase == 'tests'
        run: choco install ffmpeg -y --no-progress
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.phase }}-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Gate
        shell: bash
        run: bin/gate ${{ matrix.phase }}
